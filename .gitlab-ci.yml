stages:
  - build
  - unit-tests
  - e2e-tests
  - deploy


# ---------------------------------------------
# Build Stage
build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0   # Empfohlenes offizielles .NET 8 Image
  tags:
    - sopro
  script:
    - cd TraineeTracker         # Gehe in dein Hauptprojekt
    - dotnet build              # Baue das Projekt


# ---------------------------------------------
# Unit Test Stage:
unit-tests:
  stage: unit-tests
  image: mcr.microsoft.com/dotnet/sdk:8.0   # Empfohlenes offizielles .NET 8 Image
  tags:
    - sopro
  script:
    - cd TraineeTracker.UnitTests
    - dotnet test
  needs:
    - build

# ---------------------------------------------
# E2E Test Stage:
e2e-tests:
  stage: e2e-tests
  image: mcr.microsoft.com/dotnet/sdk:8.0   # Empfohlenes offizielles .NET 8 Image
  tags:
    - sopro
  script:
    # Starte das Hauptprojekt als Server im Hintergrund
    - cd TraineeTracker
    - dotnet run --environment Development &
    - sleep 5  # Gib dem Server Zeit, um zu starten

    # Chrome installieren (Selenium braucht echten Browser!)
    - apt update -q -y
    - apt --yes install libnss3 xvfb libx11-6 libgconf-2-4 unzip gnupg
    - wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    - apt install ./google-chrome-stable_current_amd64.deb -y

    # Wechsel ins E2E-Testprojekt
    - cd ../TraineeTracker.E2ETests

    # E2E-Tests ausführen
    - dotnet test
  needs:
    - build

# ---------------------------------------------
# Deploy:
deploy:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - sopro
  variables:
    KANIKO_ARGS: "--single-snapshot"
    KANIKO_BUILD_CONTEXT: $CI_PROJECT_DIR/TraineeTracker
    IMAGE_TAG_NAME: kaniko-docker
  script:
    - export IMAGE_TAG=${CI_REGISTRY_IMAGE}/TraineeTracker:${IMAGE_TAG_NAME}
    - echo $IMAGE_TAG
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - DOCKERFILE_PATH=${DOCKERFILE_PATH:-"$KANIKO_BUILD_CONTEXT/Dockerfile"}
    - /kaniko/executor --context $KANIKO_BUILD_CONTEXT --dockerfile $DOCKERFILE_PATH --destination $IMAGE_TAG $KANIKO_ARGS
  needs:
    - unit-tests
    - e2e-tests
