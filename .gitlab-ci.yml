stages:
  - build
  - unit-tests
  - e2e-tests
  - deploy
  - portainer

# ---------------------------------------------
# Build Stage
build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  tags:
    - sopro
  script:
    - cd TraineeTracker         # Navigate into the main project
    - dotnet build              # Build the project
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^[a-zA-Z]+_[0-9][0-9]$/'

# ---------------------------------------------
# Unit Test Stage:
unit-tests:
  stage: unit-tests
  image: mcr.microsoft.com/dotnet/sdk:8.0
  tags:
    - sopro
  script:
    - cd TraineeTracker.UnitTests
    - dotnet test
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^[a-zA-Z]+_[0-9][0-9]$/'

# ---------------------------------------------
# E2E Test Stage:
e2e-tests:
  stage: e2e-tests
  image: mcr.microsoft.com/dotnet/sdk:8.0
  tags:
    - sopro
  script:
    # Start the main project as a background server
    - cd TraineeTracker
    - dotnet run --environment Development &
    - sleep 5  # Give the server time to start

    # Install Chrome (Selenium requires a real browser)
    - apt update -q -y
    - apt --yes install libnss3 xvfb libx11-6 libgconf-2-4 unzip gnupg
    - wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    - apt install ./google-chrome-stable_current_amd64.deb -y

    # Switch to E2E test project
    - cd ../TraineeTracker.E2ETests

    # Run E2E tests
    - dotnet test
  needs:
    - build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^[a-zA-Z]+_[0-9][0-9]$/'

# ---------------------------------------------
# Deploy:
deploy:
  stage: deploy

  # Use Kaniko executor image (no Docker daemon needed)
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - sopro
  variables:
    KANIKO_ARGS: "--single-snapshot"                      # Optimize image size (single layer)
    KANIKO_BUILD_CONTEXT: $CI_PROJECT_DIR/TraineeTracker  # Docker build context
    IMAGE_TAG_NAME: kaniko-docker                         # Image tag suffix
  script:
    # Construct full Docker image name with tag
    - export IMAGE_TAG=${CI_REGISTRY_IMAGE}/traineetracker:${IMAGE_TAG_NAME}
    - echo $IMAGE_TAG

    # Create Docker config file for authentication
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

    # Determine Dockerfile path (default if not explicitly set)
    - DOCKERFILE_PATH=${DOCKERFILE_PATH:-"$KANIKO_BUILD_CONTEXT/Dockerfile"}

    # Execute Kaniko to build and push the Docker image
    - /kaniko/executor --context $KANIKO_BUILD_CONTEXT --dockerfile $DOCKERFILE_PATH --destination $IMAGE_TAG $KANIKO_ARGS
  needs:
    - unit-tests
    - e2e-tests
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"' # Only run deploy on main branch
    
# ---------------------------------------------
# Portainer:
portainer:
  stage: portainer
  image: curlimages/curl:latest
  variables:
    CONTAINER_WEB_HOOK: https://portainer.isse.de/api/webhooks/00bb9b4c-deb3-4f68-8647-fcba615e8f42
  tags:
    - sopro
  script:
    - sleep 10                          # Wait until the Docker image is fully built
    - curl -X POST $CONTAINER_WEB_HOOK  # Notify Portainer: new image is ready
  needs:
    - deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------